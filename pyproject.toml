[project]
name = "enterprise-research-agent"
version = "0.1.0"
description = "Evidence-grounded enterprise research agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "openai>=1.0,<2.0",
    "tavily-python>=0.5,<1.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

reranker = [
    "FlagEmbedding>=1.4,<2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
